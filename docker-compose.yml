services:
  app:
    build: .
    container_name: ${APP_NAME}
    command: [ "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload" ]
    volumes:
      - .:/app
    ports:
      - "${HOST_PORT}:8000"
    env_file:
      - .env
    environment:
      - TZ=Europe/Moscow
    depends_on:
      - db
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:15.2-alpine
    container_name: ${APP_NAME}_db
    env_file:
      - .env
    ports:
      - ${DB_PORT}:5432
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - ./data/:/var/lib/postgresql/data/

