[tool.poetry]
name = "ITEACH"
version = "0.1.0"
description = "Iteach service"
authors = ["Your Name"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.0"
uvicorn = "^0.24.0"
pydantic = "^2.8"
httpx = "^0.25.0"
jinja2 = "^3.1.2"
aiofiles = "^23.2.1"
python-multipart = "^0.0.6"
bcrypt = "^4.0.1"
pydantic-settings = "^2.1.0"
APScheduler = "3.11.0"
boto3 = "1.37.4"
alembic = "1.11.3"
psycopg2-binary = "2.9.7"
asyncpg = "0.28.0"
sqlalchemy = "2.0.20"
elasticsearch = "7.10.1"
sentry-sdk = "2.19.2"
email-validator = "2.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-cov = "^5.0.0"
ruff = "^0.6.9"
mypy = "^1.11.2"
pre-commit = "^3.8.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
ignore_missing_imports = true
warn_unused_ignores = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
